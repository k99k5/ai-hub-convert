services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      UPSTREAM_BASE_URL: "${UPSTREAM_BASE_URL:?UPSTREAM_BASE_URL is required}"
      ALLOW_INSECURE_UPSTREAM: "${ALLOW_INSECURE_UPSTREAM:-false}"
      CLAUDE_CODE_MIN_VERSION: "${CLAUDE_CODE_MIN_VERSION:-}"
      CLAUDE_CODE_MAX_VERSION: "${CLAUDE_CODE_MAX_VERSION:-}"
      PROMPT_CACHE_BREAKPOINTS_ENABLED: "${PROMPT_CACHE_BREAKPOINTS_ENABLED:-true}"
      READ_TOOL_COMPAT_ENABLED: "${READ_TOOL_COMPAT_ENABLED:-true}"
      SYNTHETIC_THINKING_SIGNATURE_ENABLED: "${SYNTHETIC_THINKING_SIGNATURE_ENABLED:-true}"
      BODY_LIMIT_BYTES: "${BODY_LIMIT_BYTES:-33554432}"
      ANTHROPIC_PING_INTERVAL_MS: "${ANTHROPIC_PING_INTERVAL_MS:-15000}"
      CONNECTION_TIMEOUT_MS: "${CONNECTION_TIMEOUT_MS:-0}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-30000}"
      UPSTREAM_TIMEOUT_MS: "${UPSTREAM_TIMEOUT_MS:-600000}"
      UPSTREAM_FIRST_BYTE_TIMEOUT_MS: "${UPSTREAM_FIRST_BYTE_TIMEOUT_MS:-60000}"
      UPSTREAM_STREAM_IDLE_TIMEOUT_MS: "${UPSTREAM_STREAM_IDLE_TIMEOUT_MS:-120000}"
      UPSTREAM_TOOL_ARGUMENT_LIMIT_BYTES: "${UPSTREAM_TOOL_ARGUMENT_LIMIT_BYTES:-1048576}"
      UPSTREAM_STREAM_TOOL_ARGUMENT_LIMIT_BYTES: "${UPSTREAM_STREAM_TOOL_ARGUMENT_LIMIT_BYTES:-8388608}"
      UPSTREAM_SSE_FRAME_LIMIT_BYTES: "${UPSTREAM_SSE_FRAME_LIMIT_BYTES:-8388608}"
      UPSTREAM_OUTPUT_ITEM_LIMIT_BYTES: "${UPSTREAM_OUTPUT_ITEM_LIMIT_BYTES:-8388608}"
      UPSTREAM_STREAM_OUTPUT_LIMIT_BYTES: "${UPSTREAM_STREAM_OUTPUT_LIMIT_BYTES:-33554432}"
      UPSTREAM_JSON_BODY_LIMIT_BYTES: "${UPSTREAM_JSON_BODY_LIMIT_BYTES:-33554432}"
      UPSTREAM_ERROR_BODY_LIMIT_BYTES: "${UPSTREAM_ERROR_BODY_LIMIT_BYTES:-65536}"
      SHUTDOWN_GRACE_MS: "${SHUTDOWN_GRACE_MS:-10000}"
    stop_grace_period: 15s
