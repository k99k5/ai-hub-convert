name: Address PR 13 Responses Replay Review

on:
  push:
    branches:
      - debug/web-search-usage-logs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Responses replay preservation and test
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/protocols/openai-responses/encode.ts')
          s = p.read_text()
          old = '''  if (messageContent.length > 0) {
    if (message.role === "tool") {
      throw new OpenAIAdapterError(
        "INVALID_OPENAI_RESPONSES_REQUEST",
        "Responses tool messages may contain only function results",
      );
    }
    items.push({ type: "message", role: message.role, content: messageContent });
  }
'''
          new = '''  if (messageContent.length > 0) {
    if (message.role === "tool") {
      throw new OpenAIAdapterError(
        "INVALID_OPENAI_RESPONSES_REQUEST",
        "Responses tool messages may contain only function results",
      );
    }
    items.push({ type: "message", role: message.role, content: messageContent });
  } else if (message.role === "assistant" && message.content.length === 0) {
    items.push({ type: "message", role: "assistant", content: [] });
  }
'''
          if old not in s:
              raise SystemExit('encodeMessage anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

          cat > test/unit/anthropic-web-search-responses-replay.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { decodeAnthropicRequest } from "../../src/protocols/anthropic/decode.js";
          import { encodeResponsesRequest } from "../../src/protocols/openai-responses/encode.js";

          describe("Anthropic Web Search replay through Responses encoding", () => {
            it("preserves a replay-only assistant turn in the upstream Responses input", () => {
              const canonical = decodeAnthropicRequest({
                model: "claude-test",
                max_tokens: 128,
                messages: [
                  { role: "user", content: "search first" },
                  {
                    role: "assistant",
                    content: [
                      {
                        type: "server_tool_use",
                        id: "srvtoolu_ai_hub_0",
                        name: "web_search",
                        input: { query: "current info" },
                      },
                      {
                        type: "web_search_tool_result",
                        tool_use_id: "srvtoolu_ai_hub_0",
                        content: [],
                      },
                    ],
                  },
                  { role: "user", content: "continue" },
                ],
              });

              const encoded = encodeResponsesRequest(canonical, {
                store: false,
                promptCache: { kind: "none" },
              });

              expect(encoded.input).toEqual([
                {
                  type: "message",
                  role: "user",
                  content: [{ type: "input_text", text: "search first" }],
                },
                { type: "message", role: "assistant", content: [] },
                {
                  type: "message",
                  role: "user",
                  content: [{ type: "input_text", text: "continue" }],
                },
              ]);
            });
          });
          EOF

          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:coverage
          pnpm build

          rm .github/workflows/address-pr13-responses-replay.yml
          git config user.name "TigerKK"
          git config user.email "545551320@qq.com"
          git add -A
          git commit -m "fix: preserve replay-only assistant turns in Responses"
          git push origin HEAD:debug/web-search-usage-logs
