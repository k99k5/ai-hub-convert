name: Address PR 13 Responses Replay Review

on:
  push:
    branches:
      - debug/web-search-usage-logs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Responses replay preservation and test
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/protocols/openai-responses/encode.ts"); s=p.read_text(); old="    items.push({ type: \"message\", role: message.role, content: messageContent });\n  }\n\n  for (const part of message.content) {"; new="    items.push({ type: \"message\", role: message.role, content: messageContent });\n  } else if (message.role === \"assistant\" && message.content.length === 0) {\n    items.push({ type: \"message\", role: \"assistant\", content: [] });\n  }\n\n  for (const part of message.content) {"; assert old in s; p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; Path("test/unit/anthropic-web-search-responses-replay.test.ts").write_text("""import { describe, expect, it } from \"vitest\";\nimport { decodeAnthropicRequest } from \"../../src/protocols/anthropic/decode.js\";\nimport { encodeResponsesRequest } from \"../../src/protocols/openai-responses/encode.js\";\n\ndescribe(\"Anthropic Web Search replay through Responses encoding\", () => {\n  it(\"preserves a replay-only assistant turn in the upstream Responses input\", () => {\n    const canonical = decodeAnthropicRequest({\n      model: \"claude-test\",\n      max_tokens: 128,\n      messages: [\n        { role: \"user\", content: \"search first\" },\n        {\n          role: \"assistant\",\n          content: [\n            {\n              type: \"server_tool_use\",\n              id: \"srvtoolu_ai_hub_0\",\n              name: \"web_search\",\n              input: { query: \"current info\" },\n            },\n            {\n              type: \"web_search_tool_result\",\n              tool_use_id: \"srvtoolu_ai_hub_0\",\n              content: [],\n            },\n          ],\n        },\n        { role: \"user\", content: \"continue\" },\n      ],\n    });\n\n    const encoded = encodeResponsesRequest(canonical, {\n      store: false,\n      promptCache: { kind: \"none\" },\n    });\n\n    expect(encoded.input).toEqual([\n      {\n        type: \"message\",\n        role: \"user\",\n        content: [{ type: \"input_text\", text: \"search first\" }],\n      },\n      { type: \"message\", role: \"assistant\", content: [] },\n      {\n        type: \"message\",\n        role: \"user\",\n        content: [{ type: \"input_text\", text: \"continue\" }],\n      },\n    ]);\n  });\n});\n""")'
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:coverage
          pnpm build
          rm .github/workflows/address-pr13-responses-replay.yml
          git config user.name "TigerKK"
          git config user.email "545551320@qq.com"
          git add -A
          git commit -m "fix: preserve replay-only assistant turns in Responses"
          git push origin HEAD:debug/web-search-usage-logs
