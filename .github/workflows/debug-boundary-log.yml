name: Debug Anthropic boundary logging

on:
  push:
    branches: [debug/web-search-usage-logs]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply logging patch
        run: python3 .github/debug-boundary-log.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec biome format --write src/app.ts
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit logging
        run: |
          rm -f .github/debug-boundary-log.py .github/workflows/debug-boundary-log.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'debug: log Anthropic 400 request shape'
          git push origin HEAD:debug/web-search-usage-logs
