name: Debug implement native web search

on:
  push:
    branches: [debug/web-search-usage-logs]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Implement real native Anthropic web search blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise RuntimeError(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # web-search-loop.ts: carry the real provider execution trace through the synthesized stream.
          replace_once(
              'src/upstream/web-search-loop.ts',
              'import { INTERNAL_WEB_SEARCH_TOOL_NAME } from "../providers/web-search/internal.js";\n',
              'import { Buffer } from "node:buffer";\nimport { INTERNAL_WEB_SEARCH_TOOL_NAME } from "../providers/web-search/internal.js";\n',
          )

          replace_once(
              'src/upstream/web-search-loop.ts',
              '''export interface InternalToolCalls {
            webSearch: InternalWebSearchCall[];
            hasOtherToolCalls: boolean;
          }

          function isRecord(value: unknown): value is Record<string, unknown> {''',
              '''export interface InternalToolCalls {
            webSearch: InternalWebSearchCall[];
            hasOtherToolCalls: boolean;
          }

          export interface WebSearchExecution {
            id: string;
            query: string;
            results: WebSearchResult[];
          }

          const INTERNAL_WEB_SEARCH_TRACE_KEY = "__ai_hub_web_search_trace";

          function isRecord(value: unknown): value is Record<string, unknown> {''',
          )

          replace_once(
              'src/upstream/web-search-loop.ts',
              '''function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }

          export function getWebSearchRequestCount(response: unknown): number | undefined {''',
              '''function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }

          function normalizeWebSearchExecutions(value: unknown): WebSearchExecution[] {
            if (!Array.isArray(value)) {
              return [];
            }
            const executions: WebSearchExecution[] = [];
            for (const rawExecution of value) {
              if (
                !isRecord(rawExecution) ||
                typeof rawExecution.id !== "string" ||
                typeof rawExecution.query !== "string" ||
                !Array.isArray(rawExecution.results)
              ) {
                return [];
              }
              const results: WebSearchResult[] = [];
              for (const rawResult of rawExecution.results) {
                if (
                  !isRecord(rawResult) ||
                  typeof rawResult.title !== "string" ||
                  typeof rawResult.url !== "string" ||
                  typeof rawResult.content !== "string"
                ) {
                  return [];
                }
                results.push({
                  title: rawResult.title,
                  url: rawResult.url,
                  content: rawResult.content,
                });
              }
              executions.push({ id: rawExecution.id, query: rawExecution.query, results });
            }
            return executions;
          }

          export function attachWebSearchExecutions(
            response: unknown,
            executions: readonly WebSearchExecution[],
          ): unknown {
            if (!isRecord(response) || executions.length === 0) {
              return response;
            }
            return {
              ...response,
              [INTERNAL_WEB_SEARCH_TRACE_KEY]: executions.map((execution) => ({
                id: execution.id,
                query: execution.query,
                results: execution.results.map((result) => ({ ...result })),
              })),
            };
          }

          export function getWebSearchExecutions(response: unknown): WebSearchExecution[] {
            return isRecord(response)
              ? normalizeWebSearchExecutions(response[INTERNAL_WEB_SEARCH_TRACE_KEY])
              : [];
          }

          export function decodeWebSearchExecutionsHeader(value: string | null): WebSearchExecution[] {
            if (value === null || value.length === 0) {
              return [];
            }
            try {
              return normalizeWebSearchExecutions(
                JSON.parse(Buffer.from(value, "base64url").toString("utf8")) as unknown,
              );
            } catch {
              return [];
            }
          }

          export function getWebSearchRequestCount(response: unknown): number | undefined {''',
          )

          replace_once(
              'src/upstream/web-search-loop.ts',
              '''  const body =
            path === "responses" ? synthesizeResponsesStream(response) : synthesizeChatStream(response);
          const webSearchRequests = getWebSearchRequestCount(response);
          return new Response(body, {
            status: 200,
            headers: {
              "content-type": "text/event-stream; charset=utf-8",
              ...(webSearchRequests === undefined
                ? {}
                : { "x-ai-hub-web-search-requests": String(webSearchRequests) }),
            },
          });''',
              '''  const webSearchExecutions = getWebSearchExecutions(response);
          const { [INTERNAL_WEB_SEARCH_TRACE_KEY]: _trace, ...streamResponse } = response;
          const body =
            path === "responses"
              ? synthesizeResponsesStream(streamResponse)
              : synthesizeChatStream(streamResponse);
          const webSearchRequests = getWebSearchRequestCount(response);
          const traceHeader =
            webSearchExecutions.length === 0
              ? undefined
              : Buffer.from(JSON.stringify(webSearchExecutions), "utf8").toString("base64url");
          return new Response(body, {
            status: 200,
            headers: {
              "content-type": "text/event-stream; charset=utf-8",
              ...(webSearchRequests === undefined
                ? {}
                : { "x-ai-hub-web-search-requests": String(webSearchRequests) }),
              ...(traceHeader === undefined ? {} : { "x-ai-hub-web-search-trace": traceHeader }),
            },
          });''',
          )

          # client.ts: retain query + provider results for every actual search execution.
          replace_once(
              'src/upstream/client.ts',
              '''  appendWebSearchResults,
            attachWebSearchRequestCount,
            decodeWebSearchRequest,''',
              '''  appendWebSearchResults,
            attachWebSearchExecutions,
            attachWebSearchRequestCount,
            decodeWebSearchRequest,''',
          )
          replace_once(
              'src/upstream/client.ts',
              '''  hasInternalWebSearchTool,
            synthesizeCompletionStream,
          } from "./web-search-loop.js";''',
              '''  hasInternalWebSearchTool,
            synthesizeCompletionStream,
            type WebSearchExecution,
          } from "./web-search-loop.js";''',
          )
          replace_once(
              'src/upstream/client.ts',
              '''    let currentBody = forceNonStreamingBody(path, body);
            let webSearchRequests = 0;
            for (let round = 0; round < MAX_WEB_SEARCH_ROUNDS; round += 1) {''',
              '''    let currentBody = forceNonStreamingBody(path, body);
            let webSearchRequests = 0;
            const webSearchExecutions: WebSearchExecution[] = [];
            for (let round = 0; round < MAX_WEB_SEARCH_ROUNDS; round += 1) {''',
          )
          replace_once(
              'src/upstream/client.ts',
              '''      if (calls.webSearch.length === 0) {
                const finalBody = attachWebSearchRequestCount(responseBody, webSearchRequests);
                debugWebSearch("loop_complete", {
                  path,
                  round,
                  executedCount: webSearchRequests,
                  attachedCount: getWebSearchRequestCount(finalBody),
                });
                return finalBody;
              }''',
              '''      if (calls.webSearch.length === 0) {
                const finalBody = attachWebSearchExecutions(
                  attachWebSearchRequestCount(responseBody, webSearchRequests),
                  webSearchExecutions,
                );
                debugWebSearch("loop_complete", {
                  path,
                  round,
                  executedCount: webSearchRequests,
                  attachedCount: getWebSearchRequestCount(finalBody),
                  traceCount: webSearchExecutions.length,
                });
                return finalBody;
              }''',
          )
          replace_once(
              'src/upstream/client.ts',
              '''          webSearchRequests += 1;
                  debugWebSearch("provider_execute_done", {''',
              '''          webSearchRequests += 1;
                  webSearchExecutions.push({
                    id: call.id,
                    query: searchRequest.query,
                    results: results.map((result) => ({ ...result })),
                  });
                  debugWebSearch("provider_execute_done", {''',
          )
          replace_once(
              'src/upstream/client.ts',
              '''        headerCount: stream.headers.get("x-ai-hub-web-search-requests"),
              });''',
              '''        headerCount: stream.headers.get("x-ai-hub-web-search-requests"),
                hasTraceHeader: stream.headers.has("x-ai-hub-web-search-trace"),
              });''',
          )

          # app.ts: decode the trace header and give it to the Anthropic stream encoder.
          replace_once(
              'src/app.ts',
              '''import { getWebSearchRequestCount } from "./upstream/web-search-loop.js";''',
              '''import {
            decodeWebSearchExecutionsHeader,
            getWebSearchRequestCount,
          } from "./upstream/web-search-loop.js";''',
          )
          replace_once(
              'src/app.ts',
              '''  const webSearchRequests = readWebSearchUsageHeader(response);
            const encoder = new AnthropicStreamEncoder(encoderOptions);''',
              '''  const webSearchRequests = readWebSearchUsageHeader(response);
            const webSearchExecutions = decodeWebSearchExecutionsHeader(
              response.headers.get("x-ai-hub-web-search-trace"),
            );
            const encoder = new AnthropicStreamEncoder({ ...encoderOptions, webSearchExecutions });''',
          )

          # stream-encode.ts: replace the count-only probe with real native query/result blocks.
          replace_once(
              'src/protocols/anthropic/stream-encode.ts',
              '''  outputLimits?: StreamOutputLimits;
          }''',
              '''  outputLimits?: StreamOutputLimits;
            webSearchExecutions?: readonly {
              id: string;
              query: string;
              results: readonly { title: string; url: string; content: string }[];
            }[];
          }''',
          )

          p = Path('src/protocols/anthropic/stream-encode.ts')
          text = p.read_text()
          start_marker = '  #complete(event: Extract<CanonicalEvent, { type: "response_complete" }>): AnthropicSseFrame[] {'
          end_marker = '\n  #assertStarted(): void {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''  #complete(event: Extract<CanonicalEvent, { type: "response_complete" }>): AnthropicSseFrame[] {
            this.#assertStarted();
            if (this.#openBlocks.size > 0) {
              throw new Error("Anthropic stream cannot complete with open content blocks");
            }
            this.#completed = true;
            const usage = encodeUsage(event.usage);
            const webSearchExecutions = this.options.webSearchExecutions ?? [];
            const nativeWebSearchFrames: AnthropicSseFrame[] = [];
            let nextIndex =
              this.#seenIndices.size === 0 ? 0 : Math.max(...this.#seenIndices.values()) + 1;
            let nativeResultCount = 0;
            for (const [searchIndex, execution] of webSearchExecutions.entries()) {
              const toolUseId = `srvtoolu_ai_hub_${searchIndex}`;
              nativeWebSearchFrames.push(
                {
                  event: "content_block_start",
                  data: {
                    type: "content_block_start",
                    index: nextIndex,
                    content_block: { type: "server_tool_use", id: toolUseId, name: "web_search" },
                  },
                },
                frame("content_block_delta", nextIndex, {
                  type: "input_json_delta",
                  partial_json: JSON.stringify({ query: execution.query }),
                }),
                {
                  event: "content_block_stop",
                  data: { type: "content_block_stop", index: nextIndex },
                },
              );
              nextIndex += 1;
              nativeResultCount += execution.results.length;
              nativeWebSearchFrames.push(
                {
                  event: "content_block_start",
                  data: {
                    type: "content_block_start",
                    index: nextIndex,
                    content_block: {
                      type: "web_search_tool_result",
                      tool_use_id: toolUseId,
                      content: execution.results.map((result) => ({
                        type: "web_search_result",
                        title: result.title,
                        url: result.url,
                      })),
                    },
                  },
                },
                {
                  event: "content_block_stop",
                  data: { type: "content_block_stop", index: nextIndex },
                },
              );
              nextIndex += 1;
            }
            process.stderr.write(
              `[web-search-debug] ${JSON.stringify({
                event: "anthropic_stream_complete",
                canonicalWebSearchRequests: event.usage.webSearchRequests,
                encodedServerToolUse: usage.server_tool_use,
                nativeSearchBlocks: webSearchExecutions.length,
                nativeSearchResults: nativeResultCount,
              })}\\n`,
            );
            if (webSearchExecutions.length > 0) {
              process.stderr.write(
                `[web-search-debug] ${JSON.stringify({
                  event: "native_web_search_emitted",
                  searches: webSearchExecutions.length,
                  results: nativeResultCount,
                  queryPreviews: webSearchExecutions.map((execution) => execution.query.slice(0, 160)),
                })}\\n`,
              );
            }
            return [
              ...nativeWebSearchFrames,
              {
                event: "message_delta",
                data: {
                  type: "message_delta",
                  delta: {
                    stop_reason: encodeStopReason(event.finishReason),
                    stop_sequence: event.stopSequence ?? null,
                  },
                  usage,
                },
              },
              { event: "message_stop", data: { type: "message_stop" } },
            ];
          }
'''
          p.write_text(text[:start] + replacement + text[end:])

          # Tests: trace propagation + real native block payload.
          replace_once(
              'test/unit/web-search-usage.test.ts',
              '''import { getWebSearchRequestCount } from "../../src/upstream/web-search-loop.js";''',
              '''import {
            decodeWebSearchExecutionsHeader,
            getWebSearchRequestCount,
          } from "../../src/upstream/web-search-loop.js";''',
          )

          test_path = Path('test/unit/web-search-usage.test.ts')
          test_text = test_path.read_text()
          insert_before = '\n  it("emits server_tool_use.web_search_requests in non-streaming Anthropic usage", () => {'
          if insert_before not in test_text:
              raise RuntimeError('test insertion marker not found')
          extra_test = '''
            it("carries real web search query and results into synthesized stream metadata", async () => {
              const responses = [
                {
                  id: "resp_search",
                  model: "test-model",
                  status: "completed",
                  output: [
                    {
                      type: "function_call",
                      call_id: "call_search",
                      name: INTERNAL_WEB_SEARCH_TOOL_NAME,
                      arguments: JSON.stringify({ query: "2026年10月1日 国庆节 星期几" }),
                    },
                  ],
                  usage: { input_tokens: 1, output_tokens: 1 },
                },
                {
                  id: "resp_final",
                  model: "test-model",
                  status: "completed",
                  output: [],
                  usage: { input_tokens: 2, output_tokens: 3 },
                },
              ];
              const provider: WebSearchProvider = {
                capabilities: () => ({ execute: true, citations: false, streaming: false }),
                execute: async () => [
                  {
                    title: "2026年国庆节",
                    url: "https://example.com/national-day",
                    content: "2026年10月1日是星期四。",
                  },
                ],
              };
              const client = new UpstreamClient({
                baseUrl: new URL("https://upstream.example/v1/"),
                timeoutMs: 1_000,
                webSearchProvider: provider,
                fetch: async () => {
                  const body = responses.shift();
                  if (body === undefined) {
                    throw new Error("Unexpected upstream request");
                  }
                  return new Response(JSON.stringify(body), {
                    status: 200,
                    headers: { "content-type": "application/json" },
                  });
                },
              });

              const stream = await client.postStream(
                "responses",
                {
                  stream: true,
                  input: [],
                  tools: [
                    {
                      type: "function",
                      name: INTERNAL_WEB_SEARCH_TOOL_NAME,
                      parameters: { type: "object" },
                    },
                  ],
                },
                "test-key",
                new AbortController().signal,
              );

              expect(
                decodeWebSearchExecutionsHeader(stream.headers.get("x-ai-hub-web-search-trace")),
              ).toEqual([
                {
                  id: "call_search",
                  query: "2026年10月1日 国庆节 星期几",
                  results: [
                    {
                      title: "2026年国庆节",
                      url: "https://example.com/national-day",
                      content: "2026年10月1日是星期四。",
                    },
                  ],
                },
              ]);
            });
          '''
          test_text = test_text.replace(insert_before, '\n' + extra_test + insert_before, 1)
          test_path.write_text(test_text)

          test_text = test_path.read_text()
          closing = '\n});\n'
          if not test_text.endswith(closing):
              raise RuntimeError('unexpected test file ending')
          native_test = '''
            it("emits native Anthropic web search blocks with real query and result URLs", () => {
              const encoder = new AnthropicStreamEncoder({
                webSearchExecutions: [
                  {
                    id: "call_search",
                    query: "2026年10月1日 国庆节 星期几",
                    results: [
                      {
                        title: "2026年国庆节",
                        url: "https://example.com/national-day",
                        content: "2026年10月1日是星期四。",
                      },
                    ],
                  },
                ],
              });
              encoder.encode({ type: "response_start", id: "msg_test", model: "test-model" });
              const frames = encoder.encode({
                type: "response_complete",
                finishReason: "end_turn",
                usage: { inputTokens: 10, outputTokens: 2, webSearchRequests: 1 },
              });

              expect(frames).toContainEqual({
                event: "content_block_delta",
                data: {
                  type: "content_block_delta",
                  index: 0,
                  delta: {
                    type: "input_json_delta",
                    partial_json: JSON.stringify({ query: "2026年10月1日 国庆节 星期几" }),
                  },
                },
              });
              expect(frames).toContainEqual({
                event: "content_block_start",
                data: {
                  type: "content_block_start",
                  index: 1,
                  content_block: {
                    type: "web_search_tool_result",
                    tool_use_id: "srvtoolu_ai_hub_0",
                    content: [
                      {
                        type: "web_search_result",
                        title: "2026年国庆节",
                        url: "https://example.com/national-day",
                      },
                    ],
                  },
                },
              });
            });
          '''
          test_path.write_text(test_text[:-len(closing)] + '\n' + native_test + closing)
          PY

          rm .github/workflows/debug-implement-native-web-search.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec biome format --write src/upstream/web-search-loop.ts src/upstream/client.ts src/app.ts src/protocols/anthropic/stream-encode.ts test/unit/web-search-usage.test.ts

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "debug: emit real Anthropic web search blocks"
          git push origin HEAD:debug/web-search-usage-logs
