name: Debug implement native web search

on:
  push:
    branches: [debug/web-search-usage-logs]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply implementation patch
        shell: bash
        run: |
          python3 .github/fix-native-web-search-patcher.py
          python3 .github/debug-implement-native-web-search.py
          rm .github/fix-native-web-search-patcher.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec biome format --write src/upstream/web-search-loop.ts src/upstream/client.ts src/app.ts src/protocols/anthropic/stream-encode.ts test/unit/web-search-usage.test.ts

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "debug: emit real Anthropic web search blocks"
          git push origin HEAD:debug/web-search-usage-logs
