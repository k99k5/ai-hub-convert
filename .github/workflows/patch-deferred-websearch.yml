name: Patch Deferred WebSearch

on:
  push:
    branches:
      - fix/claude-code-deferred-websearch
    paths:
      - .github/workflows/patch-deferred-websearch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-code-deferred-websearch
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch deferred Claude Code WebSearch handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          decode = Path("src/protocols/anthropic/decode.ts")
          text = decode.read_text()
          pattern = re.compile(
              r'function normalizeAnthropicToolSearchForConversion\(\n  input: Record<string, unknown>,\n\): Record<string, unknown> \{.*?\n\}\n\nexport interface DecodedAnthropicRequest',
              re.S,
          )
          replacement = '''function isDeferredClaudeCodeWebSearchTool(tool: Record<string, unknown>): boolean {
            return tool.name === "WebSearch" && tool.defer_loading === true;
          }

          function normalizeAnthropicToolSearchForConversion(
            input: Record<string, unknown>,
          ): Record<string, unknown> {
            if (!Array.isArray(input.tools)) {
              return input;
            }

            const hasToolSearch = input.tools.some(
              (rawTool) => isRecord(rawTool) && isAnthropicToolSearchTool(rawTool),
            );
            if (!hasToolSearch) {
              return input;
            }

            let changed = false;
            const tools = input.tools.flatMap((rawTool) => {
              if (!isRecord(rawTool)) {
                return [rawTool];
              }
              if (isAnthropicToolSearchTool(rawTool)) {
                changed = true;
                return [];
              }
              if (isDeferredClaudeCodeWebSearchTool(rawTool)) {
                if (!isRecord(rawTool.input_schema) || !isJsonValue(rawTool.input_schema)) {
                  return invalidRequest();
                }
                if (rawTool.type !== undefined && rawTool.type !== "custom") {
                  return invalidRequest();
                }
                if (rawTool.description !== undefined && typeof rawTool.description !== "string") {
                  return invalidRequest();
                }
                if (rawTool.strict !== undefined && typeof rawTool.strict !== "boolean") {
                  return invalidRequest();
                }
                changed = true;
                return [
                  {
                    type: "web_search_20250305",
                    name: "web_search",
                    defer_loading: true,
                    ...(rawTool.cache_control === undefined
                      ? {}
                      : { cache_control: rawTool.cache_control }),
                  },
                ];
              }
              return [rawTool];
            });

            return changed ? { ...input, tools } : input;
          }

          export interface DecodedAnthropicRequest'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"decode normalization replacement count={count}")
          decode.write_text(text)

          loop = Path("src/upstream/web-search-loop.ts")
          text = loop.read_text()
          old = '''export function hasInternalWebSearchTool(path: CompletionPath, body: unknown): boolean {
            if (!isRecord(body) || !Array.isArray(body.tools)) {
              return false;
            }
            return body.tools.some((rawTool) => {
              if (!isRecord(rawTool)) {
                return false;
              }
              if (path === "responses") {
                return rawTool.type === "function" && rawTool.name === INTERNAL_WEB_SEARCH_TOOL_NAME;
              }
              const fn = rawTool.function;
              return rawTool.type === "function" && isRecord(fn) && fn.name === INTERNAL_WEB_SEARCH_TOOL_NAME;
            });
          }'''
          new = '''function isInternalWebSearchTool(path: CompletionPath, rawTool: unknown): boolean {
            if (!isRecord(rawTool)) {
              return false;
            }
            if (path === "responses") {
              return rawTool.type === "function" && rawTool.name === INTERNAL_WEB_SEARCH_TOOL_NAME;
            }
            const fn = rawTool.function;
            return rawTool.type === "function" && isRecord(fn) && fn.name === INTERNAL_WEB_SEARCH_TOOL_NAME;
          }

          export function hasInternalWebSearchTool(path: CompletionPath, body: unknown): boolean {
            return isRecord(body) && Array.isArray(body.tools)
              ? body.tools.some((rawTool) => isInternalWebSearchTool(path, rawTool))
              : false;
          }

          export function disableInternalWebSearchTool(
            path: CompletionPath,
            body: Record<string, unknown>,
          ): Record<string, unknown> {
            const tools = Array.isArray(body.tools)
              ? body.tools.filter((rawTool) => !isInternalWebSearchTool(path, rawTool))
              : undefined;
            const next: Record<string, unknown> = {
              ...body,
              ...(tools === undefined ? {} : { tools }),
            };
            const toolChoice = next.tool_choice;
            if (path === "responses") {
              if (
                isRecord(toolChoice) &&
                toolChoice.type === "function" &&
                toolChoice.name === INTERNAL_WEB_SEARCH_TOOL_NAME
              ) {
                next.tool_choice = "auto";
              }
            } else if (
              isRecord(toolChoice) &&
              toolChoice.type === "function" &&
              isRecord(toolChoice.function) &&
              toolChoice.function.name === INTERNAL_WEB_SEARCH_TOOL_NAME
            ) {
              next.tool_choice = "auto";
            }
            return next;
          }'''
          if old not in text:
              raise SystemExit("web-search-loop target block not found")
          loop.write_text(text.replace(old, new, 1))

          client = Path("src/upstream/client.ts")
          text = client.read_text()
          text = text.replace(
              '  decodeWebSearchRequest,\n',
              '  decodeWebSearchRequest,\n  disableInternalWebSearchTool,\n',
              1,
          )
          old = '''      const outputs = new Map<string, string>();
                const provider = this.#webSearchProviders.get("web-search");
                for (const call of calls.webSearch) {
                  const results = await provider.execute(decodeWebSearchRequest(call.arguments), {
                    requestId: upstreamRequestId,
                    signal,
                  });
                  outputs.set(call.id, encodeWebSearchResults(results));
                }
                currentBody = appendWebSearchResults(path, currentBody, responseBody, outputs);'''
          new = '''      const outputs = new Map<string, string>();
                const provider = this.#webSearchProviders.get("web-search");
                let allResultsEmpty = true;
                for (const call of calls.webSearch) {
                  const results = await provider.execute(decodeWebSearchRequest(call.arguments), {
                    requestId: upstreamRequestId,
                    signal,
                  });
                  if (results.length > 0) {
                    allResultsEmpty = false;
                  }
                  outputs.set(call.id, encodeWebSearchResults(results));
                }
                currentBody = appendWebSearchResults(path, currentBody, responseBody, outputs);
                if (allResultsEmpty) {
                  currentBody = disableInternalWebSearchTool(path, currentBody);
                }'''
          if old not in text:
              raise SystemExit("client web search loop target block not found")
          client.write_text(text.replace(old, new, 1))

          test = Path("test/unit/anthropic-tool-search-compat.test.ts")
          text = test.read_text()
          anchor = '''  it("keeps prompt-cache tool positions aligned after dropping Tool Search", () => {'''
          addition = '''  it.each(toolSearchVariants)(
            "promotes deferred Claude Code WebSearch to gateway-owned Web Search for %s",
            (type, name) => {
              const decoded = decodeAnthropicRequest({
                model: "deepseek-v4-flash",
                max_tokens: 1024,
                messages: [{ role: "user", content: "search" }],
                tools: [
                  { type, name },
                  {
                    name: "WebSearch",
                    description: "Search the web",
                    input_schema: {
                      type: "object",
                      properties: { query: { type: "string" } },
                      required: ["query"],
                    },
                    defer_loading: true,
                  },
                ],
              });

              expect(decoded.tools).toEqual([
                {
                  type: "web_search",
                  provider: "web-search",
                  version: "web_search_20250305",
                },
              ]);
            },
          );

          ''' + anchor
          if anchor not in text:
              raise SystemExit("anthropic tool search test anchor not found")
          test.write_text(text.replace(anchor, addition, 1))

          loop_test = Path("test/unit/upstream-web-search-loop.test.ts")
          text = loop_test.read_text()
          old = '''    expect(result).toMatchObject({ id: "resp_final" });
              expect(bodies).toHaveLength(2);
              expect(bodies[1]?.stream).toBe(false);'''
          new = '''    expect(result).toMatchObject({ id: "resp_final" });
              expect(bodies).toHaveLength(2);
              expect(bodies[1]?.stream).toBe(false);
              expect(JSON.stringify(bodies[1]?.tools)).not.toContain(INTERNAL_WEB_SEARCH_TOOL_NAME);'''
          if old not in text:
              raise SystemExit("upstream loop assertion anchor not found")
          loop_test.write_text(text.replace(old, new, 1))
          PY

          cat > test/integration/claude-code-deferred-websearch.test.ts <<'EOF'
          import { afterEach, expect, it } from "vitest";
          import { buildApp } from "../../src/app.js";
          import { loadConfig } from "../../src/config.js";
          import { INTERNAL_WEB_SEARCH_TOOL_NAME } from "../../src/providers/web-search/internal.js";

          const apps: Array<ReturnType<typeof buildApp>> = [];

          afterEach(async () => {
            await Promise.all(apps.splice(0).map((app) => app.close()));
          });

          it("owns Claude Code deferred WebSearch and completes an empty search without leaking tool_use", async () => {
            const bodies: Record<string, unknown>[] = [];
            let round = 0;
            const app = buildApp({
              config: loadConfig({ UPSTREAM_BASE_URL: "https://gateway.example.test/v1" }),
              logger: false,
              upstreamFetch: async (input, init) => {
                const request = new Request(input, init);
                bodies.push((await request.json()) as Record<string, unknown>);
                round += 1;
                if (round === 1) {
                  return Response.json({
                    id: "resp_search",
                    model: "deepseek-v4-flash",
                    status: "completed",
                    output: [
                      {
                        id: "fc_search",
                        type: "function_call",
                        status: "completed",
                        call_id: "call_search",
                        name: INTERNAL_WEB_SEARCH_TOOL_NAME,
                        arguments: '{"query":"2026年10月1日 国庆节 星期几"}',
                      },
                    ],
                    usage: { input_tokens: 5, output_tokens: 1 },
                  });
                }
                return Response.json({
                  id: "resp_final",
                  model: "deepseek-v4-flash",
                  status: "completed",
                  output: [
                    {
                      id: "msg_final",
                      type: "message",
                      role: "assistant",
                      status: "completed",
                      content: [{ type: "output_text", text: "搜索没有返回结果。", annotations: [] }],
                    },
                  ],
                  usage: { input_tokens: 8, output_tokens: 4 },
                });
              },
            });
            apps.push(app);

            const response = await app.inject({
              method: "POST",
              url: "/v1/messages",
              headers: {
                "content-type": "application/json",
                "x-api-key": "caller-key",
                "user-agent": "claude-cli/2.1.220 (external, cli)",
              },
              payload: {
                model: "deepseek-v4-flash",
                max_tokens: 64,
                stream: true,
                messages: [{ role: "user", content: "2026年10月1日 国庆节 星期几" }],
                tools: [
                  {
                    type: "tool_search_tool_regex_20251119",
                    name: "tool_search_tool_regex",
                  },
                  {
                    name: "WebSearch",
                    description: "Search the web",
                    input_schema: {
                      type: "object",
                      properties: { query: { type: "string" } },
                      required: ["query"],
                    },
                    defer_loading: true,
                  },
                ],
              },
            });

            expect(response.statusCode, response.body).toBe(200);
            expect(response.headers["content-type"]).toContain("text/event-stream");
            expect(response.body).toContain("搜索没有返回结果。");
            expect(response.body).not.toContain("WebSearch");
            expect(response.body).not.toContain(INTERNAL_WEB_SEARCH_TOOL_NAME);
            expect(bodies).toHaveLength(2);
            expect(JSON.stringify(bodies[0]?.tools)).toContain(INTERNAL_WEB_SEARCH_TOOL_NAME);
            expect(JSON.stringify(bodies[1]?.tools)).not.toContain(INTERNAL_WEB_SEARCH_TOOL_NAME);
            expect(bodies[1]?.input).toEqual(
              expect.arrayContaining([
                expect.objectContaining({
                  type: "function_call_output",
                  call_id: "call_search",
                  output: "[]",
                }),
              ]),
            );
          });
          EOF

          pnpm exec biome format --write \
            src/protocols/anthropic/decode.ts \
            src/upstream/client.ts \
            src/upstream/web-search-loop.ts \
            test/unit/anthropic-tool-search-compat.test.ts \
            test/unit/upstream-web-search-loop.test.ts \
            test/integration/claude-code-deferred-websearch.test.ts
          pnpm typecheck
          pnpm vitest run test/unit/anthropic-tool-search-compat.test.ts test/unit/upstream-web-search-loop.test.ts test/integration/claude-code-deferred-websearch.test.ts
          rm .github/workflows/patch-deferred-websearch.yml
          git config user.name "TigerKK"
          git config user.email "545551320@qq.com"
          git add src/protocols/anthropic/decode.ts src/upstream/client.ts src/upstream/web-search-loop.ts test/unit/anthropic-tool-search-compat.test.ts test/unit/upstream-web-search-loop.test.ts test/integration/claude-code-deferred-websearch.test.ts .github/workflows/patch-deferred-websearch.yml
          git commit -m "fix: own Claude Code deferred WebSearch lifecycle"
          git push origin HEAD:fix/claude-code-deferred-websearch
