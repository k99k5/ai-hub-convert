name: Patch Synthesized Responses Annotations

on:
  push:
    branches:
      - debug/web-search-trace-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-trace-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch, test, and push
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/upstream/web-search-loop.ts')
          s = p.read_text()
          anchor = '''function synthesizeResponsesStream(response: Record<string, unknown>): string {\n'''
          helper = '''function normalizeSynthesizedResponsesItem(item: unknown): unknown {\n  if (!isRecord(item) || item.type !== "message" || !Array.isArray(item.content)) {\n    return item;\n  }\n  return {\n    ...item,\n    content: item.content.map((rawPart) => {\n      if (!isRecord(rawPart) || rawPart.type !== "output_text" || Array.isArray(rawPart.annotations)) {\n        return rawPart;\n      }\n      return { ...rawPart, annotations: [] };\n    }),\n  };\n}\n\n'''
          if helper not in s:
              if anchor not in s:
                  raise SystemExit('synthesis anchor not found')
              s = s.replace(anchor, helper + anchor, 1)

          old = '''  const output = Array.isArray(response.output) ? response.output : [];\n  output.forEach((item, outputIndex) => {\n    frames.push(\n      sse("response.output_item.added", {\n        type: "response.output_item.added",\n        output_index: outputIndex,\n        item,\n      }),\n      sse("response.output_item.done", {\n        type: "response.output_item.done",\n        output_index: outputIndex,\n        item,\n      }),\n    );\n  });\n'''
          new = '''  const output = Array.isArray(response.output) ? response.output : [];\n  output.forEach((rawItem, outputIndex) => {\n    const item = normalizeSynthesizedResponsesItem(rawItem);\n    frames.push(\n      sse("response.output_item.added", {\n        type: "response.output_item.added",\n        output_index: outputIndex,\n        item,\n      }),\n      sse("response.output_item.done", {\n        type: "response.output_item.done",\n        output_index: outputIndex,\n        item,\n      }),\n    );\n  });\n'''
          if old not in s:
              raise SystemExit('output loop anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('test/integration/claude-code-deferred-websearch.test.ts')
          s = p.read_text()
          old = 'content: [{ type: "output_text", text: "搜索没有返回结果。", annotations: [] }],'
          new = 'content: [{ type: "output_text", text: "搜索没有返回结果。" }],'
          if old not in s:
              raise SystemExit('test fixture anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

          pnpm exec biome format --write src/upstream/web-search-loop.ts test/integration/claude-code-deferred-websearch.test.ts
          pnpm typecheck
          pnpm test
          rm .github/workflows/patch-synthesized-annotations.yml
          git config user.name "TigerKK"
          git config user.email "545551320@qq.com"
          git add src/upstream/web-search-loop.ts test/integration/claude-code-deferred-websearch.test.ts .github/workflows/patch-synthesized-annotations.yml
          git commit -m "fix: normalize synthesized Responses annotations"
          git push origin HEAD:debug/web-search-trace-v2
