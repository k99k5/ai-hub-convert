name: Debug web search replay compatibility

on:
  push:
    branches: [debug/web-search-usage-logs]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply replay patch
        run: python3 .github/debug-web-search-replay.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec biome format --write src/protocols/anthropic/decode.ts test/unit/anthropic-web-search-replay.test.ts

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit replay compatibility
        run: |
          rm .github/debug-web-search-replay.py .github/workflows/debug-web-search-replay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocols/anthropic/decode.ts test/unit/anthropic-web-search-replay.test.ts .github
          git commit -m "debug: accept Anthropic web search history replay"
          git push origin HEAD:debug/web-search-usage-logs
