name: Debug native web search probe

on:
  push:
    branches: [debug/web-search-usage-logs]

permissions:
  contents: write

jobs:
  apply-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply native web search block probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/protocols/anthropic/stream-encode.ts')
          text = path.read_text()
          start_marker = '  #complete(event: Extract<CanonicalEvent, { type: "response_complete" }>): AnthropicSseFrame[] {'
          end_marker = '\n  #assertStarted(): void {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''  #complete(event: Extract<CanonicalEvent, { type: "response_complete" }>): AnthropicSseFrame[] {
            this.#assertStarted();
            if (this.#openBlocks.size > 0) {
              throw new Error("Anthropic stream cannot complete with open content blocks");
            }
            this.#completed = true;
            const usage = encodeUsage(event.usage);
            const webSearchRequests = event.usage.webSearchRequests ?? 0;
            const nativeProbeFrames: AnthropicSseFrame[] = [];
            let nextIndex =
              this.#seenIndices.size === 0 ? 0 : Math.max(...this.#seenIndices.values()) + 1;
            for (let searchIndex = 0; searchIndex < webSearchRequests; searchIndex += 1) {
              const toolUseId = `srvtoolu_ai_hub_probe_${searchIndex}`;
              nativeProbeFrames.push(
                {
                  event: "content_block_start",
                  data: {
                    type: "content_block_start",
                    index: nextIndex,
                    content_block: { type: "server_tool_use", id: toolUseId, name: "web_search" },
                  },
                },
                frame("content_block_delta", nextIndex, {
                  type: "input_json_delta",
                  partial_json: JSON.stringify({ query: "web search" }),
                }),
                {
                  event: "content_block_stop",
                  data: { type: "content_block_stop", index: nextIndex },
                },
              );
              nextIndex += 1;
              nativeProbeFrames.push(
                {
                  event: "content_block_start",
                  data: {
                    type: "content_block_start",
                    index: nextIndex,
                    content_block: {
                      type: "web_search_tool_result",
                      tool_use_id: toolUseId,
                      content: [],
                    },
                  },
                },
                {
                  event: "content_block_stop",
                  data: { type: "content_block_stop", index: nextIndex },
                },
              );
              nextIndex += 1;
            }
            process.stderr.write(
              `[web-search-debug] ${JSON.stringify({
                event: "anthropic_stream_complete",
                canonicalWebSearchRequests: event.usage.webSearchRequests,
                encodedServerToolUse: usage.server_tool_use,
                nativeProbeBlocks: webSearchRequests,
              })}\\n`,
            );
            if (webSearchRequests > 0) {
              process.stderr.write(
                `[web-search-debug] ${JSON.stringify({
                  event: "native_probe_emitted",
                  webSearchRequests,
                  emittedServerToolUseBlocks: webSearchRequests,
                  emittedWebSearchToolResultBlocks: webSearchRequests,
                })}\\n`,
              );
            }
            return [
              ...nativeProbeFrames,
              {
                event: "message_delta",
                data: {
                  type: "message_delta",
                  delta: {
                    stop_reason: encodeStopReason(event.finishReason),
                    stop_sequence: event.stopSequence ?? null,
                  },
                  usage,
                },
              },
              { event: "message_stop", data: { type: "message_stop" } },
            ];
          }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm .github/workflows/debug-native-web-search-probe.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec biome format --write src/protocols/anthropic/stream-encode.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Commit probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "debug: probe native Anthropic web search blocks"
          git push origin HEAD:debug/web-search-usage-logs
