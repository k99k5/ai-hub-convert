name: Patch Web Search Tests

on:
  push:
    branches:
      - fix/web-search-noop-provider
    paths:
      - .github/workflows/patch-web-search-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-search-noop-provider
      - name: Update tests for executable Web Search
        run: |
          python - <<'PY'
          from pathlib import Path

          unit = Path("test/unit/openai-adapter.test.ts")
          text = unit.read_text()
          text = text.replace(
              'import { WebSearchUnsupportedError } from "../../src/providers/web-search/unsupported.js";',
              'import {\n  INTERNAL_WEB_SEARCH_TOOL_NAME,\n  INTERNAL_WEB_SEARCH_TOOL_SCHEMA,\n} from "../../src/providers/web-search/internal.js";',
          )
          old = '''  it("fails closed when a built-in Web Search tool reaches an upstream encoder", () => {
            const request = baseRequest({
              tools: [{ type: "web_search", provider: "web-search", version: "web_search" }],
            });

            expect(() =>
              encodeResponsesRequest(request, { store: false, promptCache: noPromptCache }),
            ).toThrowError(WebSearchUnsupportedError);
          });'''
          new = '''  it("materializes built-in Web Search as the reserved upstream Responses function", () => {
            const request = baseRequest({
              tools: [{ type: "web_search", provider: "web-search", version: "web_search" }],
              toolChoice: { type: "function", name: "web_search" },
            });

            const encoded = encodeResponsesRequest(request, {
              store: false,
              promptCache: noPromptCache,
            });
            expect(encoded.tools).toEqual([
              expect.objectContaining({
                type: "function",
                name: INTERNAL_WEB_SEARCH_TOOL_NAME,
                parameters: INTERNAL_WEB_SEARCH_TOOL_SCHEMA,
                strict: true,
              }),
            ]);
            expect(encoded.tool_choice).toEqual({
              type: "function",
              name: INTERNAL_WEB_SEARCH_TOOL_NAME,
            });
          });'''
          if old not in text:
              raise SystemExit("Responses Web Search unit block not found")
          text = text.replace(old, new)
          old = '''  it("fails closed when a built-in Web Search tool reaches the Chat encoder", () => {
            expect(() =>
              encodeChatRequest(
                baseRequest({
                  tools: [{ type: "web_search", provider: "web-search", version: "web_search" }],
                }),
              ),
            ).toThrowError(WebSearchUnsupportedError);
          });'''
          new = '''  it("materializes built-in Web Search as the reserved upstream Chat function", () => {
            const encoded = encodeChatRequest(
              baseRequest({
                tools: [{ type: "web_search", provider: "web-search", version: "web_search" }],
                toolChoice: { type: "function", name: "web_search" },
              }),
            );

            expect(encoded.tools).toEqual([
              expect.objectContaining({
                type: "function",
                function: expect.objectContaining({
                  name: INTERNAL_WEB_SEARCH_TOOL_NAME,
                  parameters: INTERNAL_WEB_SEARCH_TOOL_SCHEMA,
                  strict: true,
                }),
              }),
            ]);
            expect(encoded.tool_choice).toEqual({
              type: "function",
              function: { name: INTERNAL_WEB_SEARCH_TOOL_NAME },
            });
          });'''
          if old not in text:
              raise SystemExit("Chat Web Search unit block not found")
          unit.write_text(text)

          integration = Path("test/integration/app.test.ts")
          text = integration.read_text()
          import_anchor = 'import { loadConfig } from "../../src/config.js";'
          if 'INTERNAL_WEB_SEARCH_TOOL_NAME' not in text:
              text = text.replace(
                  import_anchor,
                  import_anchor + '\nimport { INTERNAL_WEB_SEARCH_TOOL_NAME } from "../../src/providers/web-search/internal.js";',
              )
          start = text.index('describe("Web Search preflight", () => {')
          end = text.index('describe("Anthropic Messages conversion", () => {', start)
          block = '''describe("Web Search execution", () => {
            it.each([false, true])(
              "executes Anthropic built-in search with an empty provider result for stream=%s",
              async (stream) => {
                const upstreamBodies: Record<string, unknown>[] = [];
                let round = 0;
                const app = createApp({}, async (input, init) => {
                  const request = new Request(input, init);
                  upstreamBodies.push((await request.json()) as Record<string, unknown>);
                  round += 1;
                  if (round === 1) {
                    return Response.json({
                      id: "resp_search",
                      model: "vendor/model-1",
                      status: "completed",
                      output: [
                        {
                          id: "fc_search",
                          type: "function_call",
                          status: "completed",
                          call_id: "call_search",
                          name: INTERNAL_WEB_SEARCH_TOOL_NAME,
                          arguments: '{"query":"latest news"}',
                        },
                      ],
                      usage: { input_tokens: 5, output_tokens: 1 },
                    });
                  }
                  return Response.json({
                    id: "resp_final",
                    model: "vendor/model-1",
                    status: "completed",
                    output: [
                      {
                        id: "msg_final",
                        type: "message",
                        role: "assistant",
                        status: "completed",
                        content: [
                          { type: "output_text", text: "No results found.", annotations: [] },
                        ],
                      },
                    ],
                    usage: { input_tokens: 8, output_tokens: 4 },
                  });
                });

                const response = await app.inject({
                  method: "POST",
                  url: "/v1/messages",
                  headers: { "content-type": "application/json", "x-api-key": "caller-key" },
                  payload: {
                    model: "vendor/model-1",
                    max_tokens: 64,
                    stream,
                    messages: [{ role: "user", content: "search" }],
                    tools: [{ type: "web_search_20250305", name: "web_search" }],
                  },
                });

                expect(response.statusCode, response.body).toBe(200);
                expect(upstreamBodies).toHaveLength(2);
                expect(upstreamBodies[0]?.tools).toEqual(
                  expect.arrayContaining([
                    expect.objectContaining({
                      type: "function",
                      name: INTERNAL_WEB_SEARCH_TOOL_NAME,
                    }),
                  ]),
                );
                expect(upstreamBodies[1]?.input).toEqual(
                  expect.arrayContaining([
                    expect.objectContaining({
                      type: "function_call_output",
                      call_id: "call_search",
                      output: "[]",
                    }),
                  ]),
                );
                if (stream) {
                  expect(response.headers["content-type"]).toContain("text/event-stream");
                  expect(response.body).toContain("No results found.");
                  expect(response.body).not.toContain(INTERNAL_WEB_SEARCH_TOOL_NAME);
                } else {
                  expect(response.json()).toMatchObject({
                    content: [{ type: "text", text: "No results found." }],
                    stop_reason: "end_turn",
                  });
                }
              },
            );

            it("keeps built-in Web Search in Anthropic input token counting", async () => {
              let upstreamBody: Record<string, unknown> | undefined;
              const app = createApp({}, async (input, init) => {
                upstreamBody = (await new Request(input, init).json()) as Record<string, unknown>;
                return Response.json({ object: "response.input_tokens", input_tokens: 3 });
              });

              const response = await app.inject({
                method: "POST",
                url: "/v1/messages/count_tokens",
                headers: { "content-type": "application/json", "x-api-key": "caller-key" },
                payload: {
                  model: "vendor/model-1",
                  messages: [{ role: "user", content: "search" }],
                  tools: [{ type: "web_search_20250305", name: "web_search" }],
                },
              });

              expect(response.statusCode, response.body).toBe(200);
              expect(response.json()).toEqual({ input_tokens: 3 });
              expect(upstreamBody?.tools).toEqual(
                expect.arrayContaining([
                  expect.objectContaining({
                    type: "function",
                    name: INTERNAL_WEB_SEARCH_TOOL_NAME,
                  }),
                ]),
              );
            });

            it("does not classify a function named web_search as built-in search", async () => {
              let upstreamCalls = 0;
              const app = createApp({}, async () => {
                upstreamCalls += 1;
                return Response.json({ object: "response.input_tokens", input_tokens: 3 });
              });

              const response = await app.inject({
                method: "POST",
                url: "/v1/messages/count_tokens",
                headers: { "content-type": "application/json", "x-api-key": "caller-key" },
                payload: {
                  model: "vendor/model-1",
                  messages: [{ role: "user", content: "search" }],
                  tools: [
                    {
                      type: "custom",
                      name: "web_search",
                      input_schema: { type: "object", properties: {} },
                    },
                  ],
                },
              });

              expect(response.statusCode).toBe(200);
              expect(response.json()).toEqual({ input_tokens: 3 });
              expect(upstreamCalls).toBe(1);
            });
          });

          '''
          integration.write_text(text[:start] + block + text[end:])
          PY
          rm .github/workflows/patch-web-search-tests.yml
          git config user.name "TigerKK"
          git config user.email "545551320@qq.com"
          git add test/unit/openai-adapter.test.ts test/integration/app.test.ts .github/workflows/patch-web-search-tests.yml
          git commit -m "test: update Web Search execution expectations"
          git push origin HEAD:fix/web-search-noop-provider
