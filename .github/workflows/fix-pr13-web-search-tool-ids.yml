name: Fix PR 13 Web Search server tool IDs

on:
  push:
    branches:
      - debug/web-search-usage-logs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply unique server tool ID fix and validate
        run: |
          python .github/scripts/fix_pr13_web_search_tool_ids.py
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:coverage
          pnpm build
          rm .github/scripts/fix_pr13_web_search_tool_ids.py
          rm .github/workflows/fix-pr13-web-search-tool-ids.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: derive unique Web Search server tool IDs"
          git push origin HEAD:debug/web-search-usage-logs
