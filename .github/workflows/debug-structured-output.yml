name: Debug structured output support

on:
  push:
    branches: [debug/web-search-usage-logs]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply structured output patch
        run: |
          python3 .github/debug-structured-output.py
          sed -i 's/type JsonSchemaOutputFormat/JsonSchemaOutputFormat/' src/protocols/anthropic/decode.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec biome format --write src/core/ir.ts src/protocols/anthropic/decode.ts src/protocols/openai-responses/types.ts src/protocols/openai-responses/encode.ts src/protocols/openai-chat/types.ts src/protocols/openai-chat/encode.ts src/app.ts test/unit/anthropic-structured-output.test.ts

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit structured output support
        run: |
          rm -f .github/debug-structured-output.py .github/workflows/debug-structured-output.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'debug: support Anthropic structured output conversion'
          git push origin HEAD:debug/web-search-usage-logs
