name: Fix PR 13 Search Query Byte Accounting

on:
  push:
    branches:
      - debug/web-search-usage-logs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-usage-logs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply serialized Web Search query accounting and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/protocols/anthropic/stream-encode.ts")
          source = path.read_text()
          old = "      this.#outputLimiter.add(toolIndex, queryJson);\n"
          new = "      this.#outputLimiter.addUnrelated(toolIndex, JSON.stringify(queryJson));\n"
          if old not in source:
              raise SystemExit("query accounting anchor not found")
          path.write_text(source.replace(old, new, 1))
          PY
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:coverage
          pnpm build
          rm .github/workflows/fix-pr13-search-query-bytes.yml
          git config user.name "TigerKK"
          git config user.email "545551320@qq.com"
          git add -A
          git commit -m "fix: count escaped Web Search query bytes"
          git push origin HEAD:debug/web-search-usage-logs
