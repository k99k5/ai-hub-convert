name: Patch Stream Failure Diagnostics

on:
  push:
    branches:
      - debug/web-search-trace-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-trace-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch and test
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          pnpm exec biome format --write src/app.ts src/protocols/anthropic/decode.ts
          pnpm typecheck
          pnpm test
          rm .github/workflows/patch-stream-debug.yml
          git config user.name "TigerKK"
          git config user.email "545551320@qq.com"
          git add src/app.ts src/protocols/anthropic/decode.ts .github/workflows/patch-stream-debug.yml
          git commit -m "debug: trace Anthropic stream conversion failures"
          git push origin HEAD:debug/web-search-trace-v2
