name: Patch Stream Failure Diagnostics

on:
  push:
    branches:
      - debug/web-search-trace-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/web-search-trace-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch and test
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/protocols/anthropic/decode.ts')
          s = p.read_text()
          old = '''function normalizeAnthropicToolSearchForConversion(
  input: Record<string, unknown>,
): Record<string, unknown> {
  if (!Array.isArray(input.tools)) {
    return input;
  }

  let changed = false;
'''
          new = '''function normalizeAnthropicToolSearchForConversion(
  input: Record<string, unknown>,
): Record<string, unknown> {
  if (!Array.isArray(input.tools)) {
    return input;
  }

  const rawWebSearchTools = input.tools.flatMap((rawTool) => {
    if (!isRecord(rawTool) || rawTool.name !== "WebSearch") {
      return [];
    }
    return [
      {
        type: typeof rawTool.type === "string" ? rawTool.type : null,
        defer_loading:
          typeof rawTool.defer_loading === "boolean" ? rawTool.defer_loading : null,
        has_input_schema: isRecord(rawTool.input_schema),
      },
    ];
  });
  if (rawWebSearchTools.length > 0) {
    const hasToolSearch = input.tools.some(
      (rawTool) => isRecord(rawTool) && isAnthropicToolSearchTool(rawTool),
    );
    console.error(
      `[web-search-debug] ${JSON.stringify({
        event: "anthropic.websearch.raw",
        ts: new Date().toISOString(),
        hasToolSearch,
        tools: rawWebSearchTools,
      })}`,
    );
  }

  let changed = false;
'''
          if old not in s:
              raise SystemExit('decode anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/app.ts')
          s = p.read_text()
          old = '''          } catch (error) {
            abortScope.abort(error);
            if (!reply.raw.headersSent) {
'''
          new = '''          } catch (error) {
            console.error(
              `[stream-debug] ${JSON.stringify({
                event: "anthropic.route.error",
                ts: new Date().toISOString(),
                requestId: request.id,
                headersSent: reply.raw.headersSent,
                name: error instanceof Error ? error.name : typeof error,
                message: error instanceof Error ? error.message : String(error),
                code:
                  typeof error === "object" &&
                  error !== null &&
                  "code" in error &&
                  typeof error.code === "string"
                    ? error.code
                    : null,
              })}`,
            );
            abortScope.abort(error);
            if (!reply.raw.headersSent) {
'''
          if old not in s:
              raise SystemExit('route catch anchor not found')
          s = s.replace(old, new, 1)

          old = '''  const encoder = new AnthropicStreamEncoder(encoderOptions);
  const frames = parseSseStream(response.body, timeoutOptions, signal, {
    maxFrameBytes: timeoutOptions.maxFrameBytes,
  })[Symbol.asyncIterator]();
  const pinged = new PingedIterator(frames, pingIntervalMs);
  try {
    while (true) {
      const next = await pinged.next();
      if (next.type === "done") {
        break;
      }
      if (next.type === "ping") {
        await send({ event: "ping", data: { type: "ping" } });
        pinged.markClientWrite();
        continue;
      }
