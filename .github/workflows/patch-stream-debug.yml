'''
          new = '''  const encoder = new AnthropicStreamEncoder(encoderOptions);
  const frames = parseSseStream(response.body, timeoutOptions, signal, {
    maxFrameBytes: timeoutOptions.maxFrameBytes,
  })[Symbol.asyncIterator]();
  const pinged = new PingedIterator(frames, pingIntervalMs);
  const decoderKind = decoder instanceof ResponsesStreamDecoder ? "responses" : "chat";
  let stage = "read_frame";
  let lastFrameEvent: string | null = null;
  try {
    while (true) {
      stage = "read_frame";
      const next = await pinged.next();
      if (next.type === "done") {
        break;
      }
      if (next.type === "ping") {
        stage = "send_ping";
        await send({ event: "ping", data: { type: "ping" } });
        pinged.markClientWrite();
        continue;
      }
      lastFrameEvent = next.value.event;
      stage = "decoder.decode";
      for (const event of decoder.decode(next.value)) {
        stage = `encoder.encode:${event.type}`;
        for (const encoded of encoder.encode(event)) {
          stage = `client.send:${encoded.event}`;
          await send(encoded);
          pinged.markClientWrite();
        }
      }
    }
    stage = "decoder.finish";
    decoder.finish();
  } catch (error) {
    console.error(
      `[stream-debug] ${JSON.stringify({
        event: "anthropic.transform.error",
        ts: new Date().toISOString(),
        decoder: decoderKind,
        stage,
        lastFrameEvent,
        name: error instanceof Error ? error.name : typeof error,
        message: error instanceof Error ? error.message : String(error),
        code:
          typeof error === "object" &&
          error !== null &&
          "code" in error &&
          typeof error.code === "string"
            ? error.code
            : null,
      })}`,
    );
    throw error;
  } finally {
    pinged.close();
  }
'''
          if old not in s:
              raise SystemExit('stream loop anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

          pnpm exec biome format --write src/app.ts src/protocols/anthropic/decode.ts
          pnpm typecheck
          pnpm test
          rm .github/workflows/patch-stream-debug.yml
          git config user.name "TigerKK"
          git config user.email "545551320@qq.com"
          git add src/app.ts src/protocols/anthropic/decode.ts .github/workflows/patch-stream-debug.yml
          git commit -m "debug: trace Anthropic stream conversion failures"
          git push origin HEAD:debug/web-search-trace-v2
